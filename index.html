<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Client Workspace</title>
<!-- Set the theme before first paint. As in 2h, the default is Light even when the computer uses dark mode. -->
<script>(function(){var t="light";try{var v=localStorage.getItem("ro-portal-theme");if(v==="dark"||v==="light")t=v;}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
